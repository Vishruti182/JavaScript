<body>
    <script>
        const ip= 523858423974426;
        const str=ip.toString();
        let op=''
        for (let i = 0; i < str.length; i++) {
            op += str[i];
            if (str[i] % 2 === 0 && str[i + 1] % 2 === 0) {
                op += "-";
            }
        }
        console.log(op);
    </script>
