<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        static_array = [0,1,1,2,3,4,5,5,5,6,7,7,8,9];
        let count={};
        for(let i=0; i<static_array.length; i++){
            if(static_array[i] in count){
                count[static_array[i]]+=1;
            }
            else{
                count[static_array[i]]=1;
            }
        }
        let max=0;
        let num=count[1];
        for(let key in count){
            if(count[key]>max){
                max=count[key];
                num=key
            }
        }
        console.log("max frequency "+num+" : "+max)
    </script>
</body>
</html>
