<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const staticArray = [0,1,1,2,3,4,5,5,5,6,7,7,8,9];
        const count={};
        for(let i=0; i<staticArray.length; i++){
            if(Object.hasOwn(count,staticArray[i])){
                count[staticArray[i]]+=1;
            }
            else{
                count[staticArray[i]]=1;
            }
        }
        let max=0;
        let num=count[1];
        for(let key in count){
            if(count[key]>max){
                max=count[key];
                num=key
            }
        }
        console.log("max frequency "+num+" : "+max)
    </script>
</body>
</html>
