<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num_rows=prompt("enter no. of rows");
        for (let i = 0; i <= num_rows-1; i++) {
            let pattern = "";
            for (let j = 0; j <= num_rows-1; j++) {
                if(i==0 || i==num_rows-1 || j==0 || j==num_rows-1){
                    pattern += "* ";
                }
                else{
                    pattern += "  ";
                }
            }
            
            console.log(pattern);
        }
    </script>
</body>
</html>
