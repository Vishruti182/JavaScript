<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num_rows = parseInt(prompt("Enter number of rows (top half size):"));
        for (let i = 1; i <= num_rows; i++) {
            let pattern = " ".repeat(num_rows - i);
            for (let j = 1; j <= 2 * i - 1; j++) {
                if (j == 1 || j == 2 * i - 1) {
                    pattern += "*";
                } else {
                    pattern += " ";
                }
            }
            console.log(pattern);
        }
        for (let i = num_rows - 1; i >= 1; i--) {
            let pattern = " ".repeat(num_rows - i);
            for (let j = 1; j <= 2 * i - 1; j++) {
                if (j == 1 || j == 2 * i - 1) {
                    pattern += "*";
                } else {
                    pattern += " ";
                }
            }
        console.log(pattern);
        }
    </script>
</body>
</html>
