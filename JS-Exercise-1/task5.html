<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num_rows=prompt("enter no. of rows");
        for (let i = 1; i <= num_rows; i++) {
            let pattern = "";
            space=i-1
            pattern += " ".repeat(space)
            for (let j = 1; j <= num_rows; j++) {
                if(j>=i){
                    pattern += `${j} `;
                }
            }
            console.log(pattern);
        }
        for (let i=num_rows-1; i>0; i--){
            let pattern = "";
            space=i-1
            pattern += " ".repeat(space)
            for (let j = 1; j <= num_rows; j++) {
                if(j>=i){
                    pattern += `${j} `;
                }
            }
            console.log(pattern)
        }
    </script>
</body>
</html>
