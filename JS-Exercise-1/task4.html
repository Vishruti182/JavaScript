<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numRows;
        while(true){
            numRows=prompt("enter no. of rows");
            if(numRows%2!==0){
                break;
            }
        }
        for (let i = 1; i <= numRows; i++) {
            let pattern = "";
            for (let j = 1; j <= numRows; j++) {
                if(j<=i){
                    pattern += "* "
                }
            }
            console.log(pattern);
        }
        for(let i=numRows-1; i>0; i--){
            let pattern = "";
            for (let j = 1; j <= numRows; j++) {
                if(j<=i){
                    pattern += "* "
                }
            }
            console.log(pattern);
        }
    </script>
</body>
</html>
