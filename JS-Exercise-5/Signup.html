<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Portal</title>
    <link rel="stylesheet" href="Task1.css"/>
</head>
<body>
    <form>
        <h2>Learning Portal</h2>
        <br/><br/>
        Email: <input type="email" id="mailUp" placeholder="Please enter your mail ID" required/>
        <br/><br/>
        Password: <input type="text" id="pwdUp" placeholder="Please enter your password"required/>
        <br/><br/>
        Role: <select id="role" required>
            <option value="" disabled selected hidden>--select role--</option>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
        </select>
        <br/><br/>
        <button type="submit" id="signupBtn">Sign Up</button>
        <br/><br/>
        <h5>Already have an account?<a href="Signin.html">Sign In</a></h5>
    </form>
    <script src="Task1.js"></script>
</body>
</html>
