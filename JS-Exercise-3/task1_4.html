<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Table Generator</title>
    <style>
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="showtable"></div>

    <script>
        function createTable() {
            const rows = prompt("enter no. of rows");
            const cols = prompt("enter no. of cols");
            const row_no = parseInt(rows);
            const col_no = parseInt(cols);
            const container = document.getElementById("showtable");

            const table = document.createElement("table");

            for (let r = 0; r < row_no; r++) {
                const row = document.createElement("tr");

                for (let c = 0; c < col_no; c++) {
                    const cell = document.createElement("td");

                    cell.textContent = `Row-${r} Column-${c}`;
                    row.appendChild(cell);
                }

                table.appendChild(row);
            }
            container.appendChild(table);
        }
        createTable();
    </script>

</body>
</html>
